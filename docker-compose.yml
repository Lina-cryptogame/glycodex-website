networks:
  web:
    external: true
    name: traefik_web
volumes:
  site:
services:
  fetch:
    image: node:22-alpine
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        wget -q -O /tmp/site.tgz https://codeload.github.com/Lina-cryptogame/glycodex-website/tar.gz/refs/heads/main
        rm -rf /srv/new && mkdir -p /srv/new
        tar xzf /tmp/site.tgz -C /srv/new --strip-components=1
        rm -rf /srv/public /srv/nginx
        mv /srv/new/public /srv/public && mv /srv/new/nginx /srv/nginx
        rm -rf /srv/new /tmp/site.tgz
        chmod -R a+rX /srv/public /srv/nginx
    volumes:
      - site:/srv
    network_mode: bridge
    labels:
      - traefik.enable=false
  web:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      fetch:
        condition: service_completed_successfully
    command: ["nginx", "-c", "/srv/nginx/nginx.conf", "-g", "daemon off;"]
    volumes:
      - site:/srv:ro
    networks:
      - web
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_web
      - traefik.http.routers.glycodex-web.rule=Host(`glycodex.de`) || Host(`www.glycodex.de`)
      - traefik.http.routers.glycodex-web.entrypoints=websecure
      - traefik.http.routers.glycodex-web.tls.certresolver=myresolver
      - traefik.http.routers.glycodex-web.middlewares=glycodex-www
      - traefik.http.middlewares.glycodex-www.redirectregex.regex=^https://www\.glycodex\.de/(.*)
      - traefik.http.middlewares.glycodex-www.redirectregex.replacement=https://glycodex.de/$${1}
      - traefik.http.middlewares.glycodex-www.redirectregex.permanent=true
      - traefik.http.services.glycodex-web.loadbalancer.server.port=8080
